<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="How well do you know nvRanger? Take the quiz!">
    <title>nvRanger Quiz - Official Fan Site</title>
    <link rel="icon" type="image/jpeg" href="profile-photo.jpg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h2><a href="index.html" style="text-decoration: none; color: inherit;">nvRanger</a></h2>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html#home" class="nav-link">Home</a></li>
                <li><a href="index.html#about" class="nav-link">About</a></li>
                <li><a href="index.html#memorial" class="nav-link">Memorial</a></li>
                <li><a href="index.html#fanart" class="nav-link">Fan Art</a></li>
                <li><a href="index.html#contact" class="nav-link">Contact</a></li>
                <li><a href="quiz.html" class="nav-link">Quiz</a></li>
            </ul>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

<section id="home" class="hero">
    <!-- Background styling layer -->
    <div class="hero-background"></div>

    <!-- 1. Text, photo, and standard content -->
    <div class="container">
        <div class="hero-content">
            <div class="hero-image-wrapper">
                <img src="profile-photo.jpg" alt="nvRanger" class="hero-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div class="hero-image-placeholder" style="display: none;">
                    <svg width="200" height="200" viewBox="0 0 200 200" fill="none">
                        <circle cx="100" cy="100" r="80" fill="url(#gradient)"/>
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#39ff14;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#d2b48c;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>
            <h1 class="hero-title">NVRANGER COIN</h1>
            <p class="hero-description">Powering The Future</p>
            <div class="hero-buttons"></div>
        </div>
    </div>

    <!-- 2. Tape / Coin overlay rendered last with highest z-index -->
    <div class="coin-background">
        <img src="coin2.png" alt="nvRanger Tape Overlay" class="coin-decorative-image" onerror="this.style.display='none';">
    </div>
</section>

  


</body>
</html>
